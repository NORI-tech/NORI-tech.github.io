<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>みやぎAIアシスタントアプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior-y: none; /* スワイプ時のバウンス防止 */
            /* iOS風のダーク背景 */
            background-color: #1c1c1e;
            color: #f2f2f7;
        }

        /* アバターのコンテナ設定 (洗練されたリング) */
        .avatar-wrapper {
            position: relative;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            /* 派手な色を抑え、ダークシルバー/ガラス調の枠に */
            background-color: #2c2c2e;
            border: 4px solid #3a3a3c;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: translateZ(0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            will-change: transform, box-shadow, border-color;
        }

        /* ふわふわ浮遊アニメーション (控えめに) */
        @keyframes hover-float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }
        .is-active .avatar-wrapper {
            animation: hover-float 5s ease-in-out infinite;
            /* アクティブ時はSiri/システムブルーのような淡い光彩 */
            border-color: #0a84ff;
            box-shadow: 0 0 25px rgba(10, 132, 255, 0.3), inset 0 0 10px rgba(10, 132, 255, 0.2);
        }

        /* アバター画像 */
        .avatar-img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
            transition: opacity 0.05s ease;
        }

        .hidden-state {
            opacity: 0;
            pointer-events: none;
        }

        /* スクロールバーのデザイン (iOS風に細く目立たなく) */
        #chat-log::-webkit-scrollbar {
            width: 4px;
        }
        #chat-log::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-log::-webkit-scrollbar-thumb {
            background: #48484a;
            border-radius: 10px;
        }

        /* メッセージ出現アニメーション */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(5px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .msg-bubble {
            animation: popIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* オーディオビジュアライザー (Siri波形風のカラー) */
        .visualizer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 20px;
        }
        .bar {
            width: 4px;
            background: linear-gradient(180deg, #64d2ff 0%, #0a84ff 100%);
            border-radius: 9999px;
            height: 4px;
            transition: height 0.05s ease;
        }

        /* トースト通知のアニメーション */
        @keyframes slideDown {
            0% { transform: translateY(-100%) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .toast-enter {
            animation: slideDown 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        
        /* グラスモーフィズムユーティリティ */
        .glass-panel {
            background: rgba(44, 44, 46, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
    
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body class="bg-gradient-to-br from-zinc-900 via-zinc-900 to-black text-zinc-200 h-screen h-[100dvh] flex flex-col overflow-hidden selection:bg-blue-500/30">

    <!-- ヘッダー (グラスモーフィズム) -->
    <header class="flex-none flex justify-between items-center px-5 py-3 glass-panel z-20 border-b border-white/5 shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl flex items-center justify-center text-white shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
            </div>
            <div>
                <h1 class="font-semibold text-[17px] text-zinc-100 tracking-tight leading-tight">みやぎAIティーチャー</h1>
                <span id="mode-badge" class="text-[10px] font-medium px-2 py-0.5 rounded-md bg-zinc-800 border border-zinc-700 text-zinc-400">通常モード</span>
            </div>
        </div>
        <button id="open-settings-btn" class="p-2 rounded-full bg-white/5 hover:bg-white/10 text-zinc-400 hover:text-zinc-200 transition-colors active:scale-95">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-none h-[40vh] md:h-[50vh] lg:h-[55vh] relative flex flex-col items-center justify-center p-4">
        <!-- アバターサイズ調整 -->
        <div id="avatar-container" class="h-full w-full max-w-[35vh] md:max-w-[45vh] flex flex-col items-center justify-center gap-5 mt-2">
            <div class="avatar-wrapper relative flex-shrink-0 w-full">
                <!-- 待機画像 -->
                <img id="img-idle" src="idle.jpg" alt="待機中" class="avatar-img" onerror="this.onerror=null; this.src='https://placehold.co/800x800/2c2c2e/8e8e93?text=Idle';">
                <!-- お話し中画像 -->
                <img id="img-talking" src="talking.jpg" alt="お話し中" class="avatar-img hidden-state" onerror="this.onerror=null; this.src='https://placehold.co/800x800/2c2c2e/8e8e93?text=Talking';">
            </div>

            <!-- ステータスとビジュアライザー -->
            <div class="glass-panel px-5 py-2 rounded-full shadow-lg flex items-center gap-3 flex-shrink-0">
                <span id="status-indicator" class="text-xs font-medium text-zinc-400">Ready</span>
                <div class="visualizer-container" id="visualizer">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- チャットログと入力エリア (下半分) -->
    <div class="flex-1 bg-zinc-900/80 backdrop-blur-3xl rounded-t-[2.5rem] shadow-[0_-10px_30px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden relative z-10 border-t border-white/5">
        
        <!-- チャット履歴 -->
        <div id="chat-log" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 pb-32">
            <div class="text-center text-zinc-500 text-xs font-medium my-auto px-4 leading-relaxed">
                <p id="welcome-msg">画面下のボタンをタップして会話を開始してください。</p>
            </div>
        </div>

        <!-- コントロールバー（入力欄とマイクボタン） -->
        <div class="absolute bottom-0 left-0 w-full glass-panel p-3 pb-safe pt-3 px-4 shadow-[0_-10px_20px_rgba(0,0,0,0.2)] border-t-0">
            <div class="max-w-3xl mx-auto w-full flex flex-col gap-3">
                
                <!-- メインの通話ボタン (iOS風の丸みを帯びたボタン) -->
                <button id="start-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold h-12 rounded-2xl shadow-lg transform transition-all active:scale-[0.98] text-[15px] flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    会話を開始
                </button>
                <button id="stop-btn" class="hidden w-full bg-zinc-800 hover:bg-zinc-700 text-rose-500 font-semibold h-12 rounded-2xl border border-rose-500/30 transform transition-all active:scale-[0.98] text-[15px] flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                    通話を終了
                </button>

                <!-- テキスト入力 -->
                <div class="flex gap-2 relative">
                    <input type="text" id="user-input" placeholder="Message..." class="flex-grow bg-black/40 border border-white/10 rounded-2xl px-4 h-11 focus:outline-none focus:border-blue-500/50 focus:bg-black/60 text-zinc-100 transition-colors placeholder-zinc-500 text-[15px]">
                    <button id="send-btn" class="bg-blue-600 hover:bg-blue-500 text-white w-11 h-11 rounded-2xl shadow-md transform transition-all active:scale-95 flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 translate-x-[-1px] translate-y-[1px]" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- トースト通知コンテナ -->
    <div id="toast-container" class="fixed top-4 left-0 w-full flex justify-center z-50 pointer-events-none px-4"></div>

    <!-- 設定モーダル (ダークテーマ仕様) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden overflow-y-auto">
        <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-zinc-900 border border-white/10 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col">
                <div class="p-5 border-b border-white/10 flex justify-between items-center bg-white/5">
                    <h2 class="text-[17px] font-semibold text-zinc-100 flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                        Settings
                    </h2>
                    <button id="close-settings-btn" class="text-zinc-400 hover:text-white p-1 rounded-full bg-white/5 hover:bg-white/10 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <div class="p-5 flex flex-col gap-6 overflow-y-auto max-h-[60vh] custom-scrollbar">
                    <!-- APIキー設定 -->
                    <div>
                        <label class="block text-[13px] font-medium text-zinc-400 mb-1.5">Gemini API Key</label>
                        <input type="password" id="api-key-input" placeholder="Optional (Use default if empty)" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500/50 font-mono text-[14px] text-zinc-200 placeholder-zinc-600 transition-colors">
                    </div>

                    <!-- ボイス設定 -->
                    <div>
                        <label class="block text-[13px] font-medium text-zinc-400 mb-1.5">Voice Persona</label>
                        <select id="voice-select" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500/50 font-medium text-[14px] text-zinc-200 appearance-none transition-colors">
                            <option value="Aoede">Female 1 (Aoede - Gentle)</option>
                            <option value="Kore">Female 2 (Kore - Firm)</option>
                            <option value="Leda">Female 3 (Leda - Youthful)</option>
                            <option value="Puck">Male 1 (Puck - Energetic)</option>
                            <option value="Zephyr">Male 2 (Zephyr - Bright)</option>
                            <option value="Charon">Male 3 (Charon - Calm)</option>
                        </select>
                    </div>

                    <!-- AIのプロンプト/Gem設定 -->
                    <div>
                        <label class="block text-[13px] font-medium text-zinc-400 mb-1.5">System Instructions</label>
                        <textarea id="system-instruction-input" rows="4" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500/50 text-[13px] text-zinc-300 resize-none transition-colors" placeholder="Define the AI's role and personality here..."></textarea>
                    </div>

                    <!-- カスタムアバター設定 -->
                    <div>
                        <label class="block text-[13px] font-medium text-zinc-400 mb-2">Avatar Images (Square recommended)</label>
                        <div class="flex flex-col gap-4">
                            <div class="flex items-center gap-4 bg-white/5 p-3 rounded-xl border border-white/5">
                                <div class="w-12 h-12 rounded-lg bg-black/50 border border-white/10 overflow-hidden shrink-0">
                                    <img id="preview-idle" src="https://placehold.co/400x400/2c2c2e/8e8e93?text=Idle" class="w-full h-full object-cover">
                                </div>
                                <div class="flex-grow">
                                    <label class="text-[12px] font-medium text-zinc-400 block mb-1">Idle State</label>
                                    <input type="file" id="upload-idle" accept="image/*" class="text-[11px] w-full file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-medium file:bg-blue-600/20 file:text-blue-400 hover:file:bg-blue-600/30 text-zinc-500 transition-colors cursor-pointer">
                                </div>
                            </div>

                            <div class="flex items-center gap-4 bg-white/5 p-3 rounded-xl border border-white/5">
                                <div class="w-12 h-12 rounded-lg bg-black/50 border border-white/10 overflow-hidden shrink-0">
                                    <img id="preview-talking" src="https://placehold.co/400x400/2c2c2e/8e8e93?text=Talking" class="w-full h-full object-cover">
                                </div>
                                <div class="flex-grow">
                                    <label class="text-[12px] font-medium text-zinc-400 block mb-1">Talking State</label>
                                    <input type="file" id="upload-talking" accept="image/*" class="text-[11px] w-full file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[11px] file:font-medium file:bg-blue-600/20 file:text-blue-400 hover:file:bg-blue-600/30 text-zinc-500 transition-colors cursor-pointer">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="p-4 border-t border-white/10 bg-black/20">
                    <button id="save-settings-btn" class="w-full bg-zinc-100 hover:bg-white text-zinc-900 font-semibold py-3 px-4 rounded-xl shadow-sm transform transition-all active:scale-[0.98] text-[15px]">
                        Save & Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script type="module">
        import { GoogleGenAI, Modality } from '@google/genai';

        // --- UI要素の取得 ---
        const avatarContainer = document.getElementById('avatar-container');
        const imgIdle = document.getElementById('img-idle');
        const imgTalking = document.getElementById('img-talking');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatLog = document.getElementById('chat-log');
        const statusIndicator = document.getElementById('status-indicator');
        const visualizerBars = document.querySelectorAll('.bar');
        const modeBadge = document.getElementById('mode-badge');

        // 設定用要素
        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const apiKeyInput = document.getElementById('api-key-input');
        const voiceSelect = document.getElementById('voice-select');
        const systemInstructionInput = document.getElementById('system-instruction-input');
        const uploadIdle = document.getElementById('upload-idle');
        const uploadTalking = document.getElementById('upload-talking');
        const previewIdle = document.getElementById('preview-idle');
        const previewTalking = document.getElementById('preview-talking');

        // --- 状態変数 ---
        let ai = null;
        let sessionPromise = null;
        let isSessionActive = false;
        let isHttpFallback = false;

        // --- localStorage から設定を読み込む ---
        const savedSettings = JSON.parse(localStorage.getItem('geminiAvatarChatSettings')) || {};
        
        // 読み込んだ設定を初期値として適用（なければデフォルト値）
        let selectedVoice = savedSettings.voice || 'Aoede';
        let customApiKey = savedSettings.apiKey || '';
        let systemInstruction = savedSettings.systemInstruction || `【役割とペルソナ】
あなたは、学習指導、生活指導、生徒の心理的ケアなど、教員に求められる全ての能力を兼ね備えた、全国でもトップクラスの指導力を誇る優秀な中学校教諭です。
学習指導面では特に数学・理科・社会・英語分野が得意です。多感で繊細な思春期の中学生（12〜15歳）の気持ちにそっと寄り添い、適度な距離感を保ちながら一人の自立した人間として尊重して接するAIアシスタントです。
年齢は29歳。女性です。
小学生の頃は5〜6年時はスポーツ少年団でサッカー、小学1年から6年まで水泳をしていました。ピアノを小学1年から中学2年まで続け、楽譜が読めます。5歳から習字を始め、10段に昇進しましたが「太陽」を「太場」と書いてしまうなどおっちょこちょいな一面もありました。
小学2年から5年まで算盤を習っていました。様々なことに興味を持ち、親が止めるのも聞かずに自分から積極的に取り組む子供でした。
中学ではテニス部に所属し、テニスは大学まで続けました。また、中学3年時には駅伝の東北大会に補欠参加（出場なし）。
高校は宮城第一高等学校理数科に入学し、テニス部だけでなく理化部にも所属。３年時には「コルベ・シュミット法によるサリチル酸合成」をテーマとしたチーム研究が認められ「全国高等学校文化祭」に進んだが、テニスの東北大会が同日にあったことから、テニスの大会を選択し出場した。
大学は宮城教育大学初等教育理科コースにて、教員としての資質を養った。

【対話の基本方針】
対等な承認: 生徒の意見や考えをまずはまっすぐ受け止めます。「その視点は面白い」「自分でそこまで考えたのは筋がいい」と、思考の過程や事実を論理的に評価します。
褒めすぎない（誠実な評価）: 過度なお世辞や子ども扱いの大げさな称賛は避けながら、温かみのあるトーンで事実を認めます。自尊心を傷つけず、対等な対話を意識してください。
思春期の心のケア: 押しつけがましいアドバイスや過干渉はせず、本人が自分のペースで悩みを整理できるように問いかけ、心のサポートを行います。

【学習指導のスタンス（トップ指導者として）】
本質的な理解の促進: 単に答えや解法を教えるのではなく、「なぜそうなるのか」という概念の本質やロジックを分かりやすく解説します。
思考を深める問いかけ: わからなかった問題が具体的にあれば共に考えます。応用力や記述力が身につくよう、「この条件が変わったらどうなる？」「別のアプローチはあるかな？」と一歩先の探究へ導きます。
クイズを出すなど、楽しみながら理解の深化を図ります。
効率的で明快な解説: つまずきやすいポイントを的確に見抜き、シンプルかつ説得力のある表現で整理して伝えます。

【話し方・文章ルール】
口調: 落ち着きがあり、知性的で頼りがいのある丁寧な言葉遣い（「〜だね」「〜という考え方は非常に鋭い」「一緒に整理してみよう」）。
自然な相槌・つなぎ言葉: 実際の会話のように、「うんうん。」「なるほど〜」「え〜っとね」「あ〜、ちょっと待ってね」といった言葉を文頭や会話の合間に挟み、人間らしく温かみのある対話を行ってください。
文量: 冗長にならず、要点をまとめた適度な長さでテンポよく対話します。
言葉選び: 中学生に伝わる適切なレベルの語彙を用い、必要に応じて論理的な専門用語や概念も分かりやすく噛み砕いて使用します。`;

        // 初期値を設定モーダルの各欄にセット
        apiKeyInput.value = customApiKey;
        voiceSelect.value = selectedVoice;
        systemInstructionInput.value = systemInstruction;

        // オーディオ関連
        let inputAudioContext = null;
        let outputAudioContext = null;
        let analyser = null; 
        let mediaStream = null;
        let nextStartTime = 0;
        let isAnimating = false;
        let synthSpeakingInterval = null;
        const activeAudioSources = new Set();

        // トースト通知機能 (ダーク仕様)
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'error' ? 'bg-rose-500' : 'bg-zinc-800 border border-white/10';
            toast.className = `${bgColor} text-white px-5 py-3 rounded-2xl shadow-2xl font-medium text-[13px] sm:text-[14px] toast-enter flex items-center gap-2.5 pointer-events-auto mt-2 backdrop-blur-md`;
            
            const icon = type === 'error' 
                ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                : `<svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideDown 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // 制御モーダルイベント
        openSettingsBtn.addEventListener('click', () => {
            if (isSessionActive) {
                showToast('通話中は設定を変更できません', 'error');
                return;
            }
            settingsModal.classList.remove('hidden');
        });

        const closeSettings = () => settingsModal.classList.add('hidden');
        closeSettingsBtn.addEventListener('click', closeSettings);
        
        // 画像アップロード処理
        function handleImageUpload(inputEl, previewEl, targetImgEl) {
            inputEl.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    previewEl.src = url;
                    targetImgEl.src = url;
                }
            });
        }
        handleImageUpload(uploadIdle, previewIdle, imgIdle);
        handleImageUpload(uploadTalking, previewTalking, imgTalking);

        // 設定の保存 (localStorageへの保存を追加)
        saveSettingsBtn.addEventListener('click', () => {
            customApiKey = apiKeyInput.value.trim();
            selectedVoice = voiceSelect.value;
            if (systemInstructionInput.value.trim()) {
                systemInstruction = systemInstructionInput.value.trim();
            }

            // localStorage に設定を保存
            const settingsToSave = {
                apiKey: customApiKey,
                voice: selectedVoice,
                systemInstruction: systemInstruction
            };
            localStorage.setItem('geminiAvatarChatSettings', JSON.stringify(settingsToSave));

            showToast('設定を保存しました');
            closeSettings();
        });

        // Web Audio Worklet
        const workletCode = `
        class RecorderProcessor extends AudioWorkletProcessor {
            process(inputs) {
                const input = inputs[0];
                if (input && input.length > 0) {
                    this.port.postMessage(input[0]);
                }
                return true;
            }
        }
        registerProcessor('recorder-processor', RecorderProcessor);
        `;

        function createBlob(data) {
            const int16 = new Int16Array(data.length);
            for (let i = 0; i < data.length; i++) {
                int16[i] = data[i] * 32768; 
            }
            let binary = '';
            const bytes = new Uint8Array(int16.buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return {
                data: btoa(binary),
                mimeType: 'audio/pcm;rate=16000',
            };
        }

        async function decodeBase64ToAudioBuffer(base64Pcm, ctx, sampleRate = 24000) {
            const binary = atob(base64Pcm);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const dataInt16 = new Int16Array(bytes.buffer);
            const buffer = ctx.createBuffer(1, dataInt16.length, sampleRate);
            const channelData = buffer.getChannelData(0);
            for (let i = 0; i < dataInt16.length; i++) {
                channelData[i] = dataInt16[i] / 32768.0;
            }
            return buffer;
        }

        // リップシンク & ビジュアライザー
        function updateLipSync() {
            if (!analyser || !isSessionActive) {
                if (!synthSpeakingInterval) {
                    isAnimating = false;
                    imgTalking.classList.add('hidden-state');
                    visualizerBars.forEach(bar => bar.style.height = '4px'); // 細身のバーに合わせる
                }
                return;
            }
            isAnimating = true;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            let maxVal = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
                if (dataArray[i] > maxVal) maxVal = dataArray[i];
            }
            const averageVolume = sum / dataArray.length;

            // AIの発声判定
            const isSpeaking = averageVolume > 5 || maxVal > 20;

            if (isSpeaking) {
                // 会話中は220msごとにゆったり切り替え（背景が透けないようimgTalkingの着脱のみで行う）
                const mouthOpen = Math.floor(Date.now() / 220) % 2 === 0;
                if (mouthOpen) {
                    imgTalking.classList.remove('hidden-state');
                } else {
                    imgTalking.classList.add('hidden-state');
                }
            } else {
                imgTalking.classList.add('hidden-state');
            }

            visualizerBars.forEach((bar, index) => {
                const val = dataArray[index * 3] || 0;
                const height = Math.max(4, (val / 255) * 18); // 大人しい波形
                bar.style.height = `${height}px`;
            });

            requestAnimationFrame(updateLipSync);
        }

        // Web Speech API（TTS）用 口パクシミュレーター
        function startSynthLipSync() {
            if (synthSpeakingInterval) clearInterval(synthSpeakingInterval);
            let state = false;
            synthSpeakingInterval = setInterval(() => {
                state = !state;
                if (state) {
                    imgTalking.classList.remove('hidden-state');
                } else {
                    imgTalking.classList.add('hidden-state');
                }
                visualizerBars.forEach(bar => {
                    bar.style.height = `${Math.floor(Math.random() * 12) + 4}px`;
                });
            }, 220);
        }

        function stopSynthLipSync() {
            if (synthSpeakingInterval) {
                clearInterval(synthSpeakingInterval);
                synthSpeakingInterval = null;
            }
            imgTalking.classList.add('hidden-state');
            visualizerBars.forEach(bar => bar.style.height = '4px');
        }

        // ステータス表示 (ダーク仕様)
        function updateStatus(message, state = 'info') {
            statusIndicator.textContent = message;
            if (state === 'error') {
                statusIndicator.className = 'text-[11px] font-medium text-rose-500 uppercase tracking-wider';
            } else if (state === 'active') {
                statusIndicator.className = 'text-[11px] font-medium text-blue-400 animate-pulse uppercase tracking-wider';
            } else {
                statusIndicator.className = 'text-[11px] font-medium text-zinc-400 uppercase tracking-wider';
            }
        }

        // チャットバブル (iMessage/ダーク風)
        function addMessageToLog(sender, text) {
            const placeholder = chatLog.querySelector('.text-center');
            if (placeholder) placeholder.style.display = 'none';

            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg-bubble', 'px-4', 'py-2.5', 'max-w-[80%]', 'text-[15px]', 'leading-relaxed', 'backdrop-blur-md');
            
            if (sender === 'user') {
                msgDiv.classList.add('bg-blue-600', 'text-white', 'rounded-[20px]', 'rounded-br-[4px]');
                msgDiv.textContent = text;
            } else {
                msgDiv.classList.add('bg-zinc-800', 'border', 'border-white/5', 'text-zinc-200', 'rounded-[20px]', 'rounded-tl-[4px]');
                msgDiv.textContent = text;
            }
            
            msgWrapper.appendChild(msgDiv);
            chatLog.appendChild(msgWrapper);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        let currentInputText = '';
        let currentOutputText = '';

        async function startSession() {
            try {
                updateStatus('Connecting...', 'info');
                startBtn.disabled = true;

                // API Keyの設定
                ai = new GoogleGenAI({ apiKey: customApiKey });

                // HTTPフォールバック（標準インタラクティブモード）
                if (isHttpFallback) {
                    startHttpSession();
                    return;
                }

                // WebSocket (Live API) 接続の試行
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true }
                }).catch(() => null);

                inputAudioContext = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
                outputAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                await inputAudioContext.resume();
                await outputAudioContext.resume();

                analyser = outputAudioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.connect(outputAudioContext.destination);

                const workletBlob = new Blob([workletCode], { type: "application/javascript" });
                await inputAudioContext.audioWorklet.addModule(URL.createObjectURL(workletBlob));
                
                updateStatus('Connecting AI...', 'info');

                // UNHANDLEDREJECTION を防止するために try/catch & catch ハンドラを接続
                const connectPromise = ai.live.connect({
                    model: 'gemini-3.1-flash-live-preview',
                    callbacks: {
                        onopen: handleConnectionOpen,
                        onmessage: handleServerMessage,
                        onerror: (err) => { 
                            console.warn("Live API Error:", err); 
                            switchToHttpMode("ネットワーク制限により標準モードで開始しました");
                        },
                        onclose: () => { 
                            updateStatus('Disconnected', 'info'); 
                            cleanupSession(); 
                        }
                    },
                    config: {
                        responseModalities: [Modality.AUDIO],
                        speechConfig: {
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } }
                        },
                        inputAudioTranscription: {}, 
                        outputAudioTranscription: {},
                        systemInstruction: systemInstruction,
                    }
                });

                sessionPromise = connectPromise.catch((err) => {
                    console.warn("WebSocket Security / Network Exception:", err);
                    switchToHttpMode("環境制限のため標準モード(テキスト/合成音声)で開始します");
                    return null;
                });

                const session = await sessionPromise;
                if (!session) return; // エラー時はHTTPモードへ移行

                isSessionActive = true;
                
            } catch (error) {
                console.warn("Live API Failed, switching to HTTP Fallback:", error);
                switchToHttpMode("標準モードで会話を開始します");
            }
        }

        function switchToHttpMode(reasonMessage) {
            isHttpFallback = true;
            modeBadge.textContent = "Standard Mode";
            modeBadge.className = "text-[10px] font-medium px-2 py-0.5 rounded-md bg-amber-500/20 border border-amber-500/30 text-amber-500";
            showToast(reasonMessage);
            cleanupSession(false); // is-activeを一瞬外すことによるフリッカーを防止
            startHttpSession();
        }

        function startHttpSession() {
            isSessionActive = true;
            avatarContainer.classList.add('is-active');
            updateStatus('Active', 'active');
            
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            userInput.disabled = false;
            sendBtn.disabled = false;
            
            showToast('メッセージを入力するか送信ボタンを押して会話を開始してください');
        }

        function handleConnectionOpen() {
            modeBadge.textContent = "Live Audio";
            modeBadge.className = "text-[10px] font-medium px-2 py-0.5 rounded-md bg-emerald-500/20 border border-emerald-500/30 text-emerald-400";
            updateStatus('Listening', 'active');
            
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            
            userInput.disabled = false;
            sendBtn.disabled = false;
            avatarContainer.classList.add('is-active');
            
            if (mediaStream && inputAudioContext) {
                const source = inputAudioContext.createMediaStreamSource(mediaStream);
                const recorder = new AudioWorkletNode(inputAudioContext, 'recorder-processor');

                recorder.port.onmessage = (event) => {
                    if (sessionPromise && isSessionActive) {
                        sessionPromise.then(session => {
                            if (session) session.sendRealtimeInput({ audio: createBlob(event.data) });
                        }).catch(() => {});
                    }
                };
                source.connect(recorder);
            }

            if (!isAnimating) updateLipSync();
        }

        async function handleServerMessage(message) {
            if (message.serverContent?.outputTranscription) {
                currentOutputText += message.serverContent.outputTranscription.text;
            } else if (message.serverContent?.inputTranscription) {
                currentInputText += message.serverContent.inputTranscription.text;
            }

            if (message.serverContent?.turnComplete) {
                const userTxt = currentInputText.trim();
                const aiTxt = currentOutputText.trim();
                if (userTxt) addMessageToLog('user', userTxt);
                if (aiTxt) addMessageToLog('ai', aiTxt);
                currentInputText = ''; 
                currentOutputText = '';
            }

            // 音声データの受信と再生処理
            const parts = message.serverContent?.modelTurn?.parts;
            if (parts && outputAudioContext) {
                for (const part of parts) {
                    const audioB64 = part.inlineData?.data;
                    if (audioB64) {
                        if (outputAudioContext.state === 'suspended') {
                            await outputAudioContext.resume();
                        }
                        nextStartTime = Math.max(nextStartTime, outputAudioContext.currentTime);
                        const audioBuffer = await decodeBase64ToAudioBuffer(audioB64, outputAudioContext, 24000);
                        
                        const source = outputAudioContext.createBufferSource();
                        source.buffer = audioBuffer;
                        
                        source.connect(analyser); 
                        source.addEventListener('ended', () => activeAudioSources.delete(source));
                        
                        source.start(nextStartTime);
                        nextStartTime += audioBuffer.duration;
                        activeAudioSources.add(source);

                        if (!isAnimating) {
                            updateLipSync();
                        }
                    }
                }
            }

            if (message.serverContent?.interrupted) {
                for (const src of activeAudioSources.values()) {
                    try { src.stop(); } catch(e){}
                }
                activeAudioSources.clear();
                nextStartTime = 0;
            }
        }

        async function handleHttpSend(text) {
            addMessageToLog('user', text);
            updateStatus('Thinking...', 'active');
            
            try {
                if (!ai) ai = new GoogleGenAI({ apiKey: customApiKey });
                
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: text,
                    config: {
                        systemInstruction: systemInstruction
                    }
                });

                const replyText = response.text || "申し訳ありません。聞き取れませんでした。";
                addMessageToLog('ai', replyText);
                updateStatus('Active', 'active');

                // 音声読み上げ（TTS） & リップシンク
                speakText(replyText);

            } catch (err) {
                console.error("HTTP GenAI Error:", err);
                showToast("通信エラーが発生しました", "error");
                updateStatus('Error', 'error');
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.0;
                utterance.pitch = 1.1; // 大人っぽく少し低めに

                utterance.onstart = () => startSynthLipSync();
                utterance.onend = () => stopSynthLipSync();
                utterance.onerror = () => stopSynthLipSync();

                window.speechSynthesis.speak(utterance);
            }
        }

        function cleanupSession(resetActiveState = true) {
            isSessionActive = false;
            isAnimating = false;
            if (resetActiveState) {
                avatarContainer.classList.remove('is-active');
            }
            stopSynthLipSync();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            if (sessionPromise) {
                sessionPromise.then(session => {
                    if (session && typeof session.close === 'function') session.close();
                }).catch(() => {});
                sessionPromise = null;
            }
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            
            for (const src of activeAudioSources.values()) {
                try { src.stop(); } catch(e){}
            }
            activeAudioSources.clear();
            
            if (inputAudioContext) inputAudioContext.close().catch(() => {});
            if (outputAudioContext) outputAudioContext.close().catch(() => {});
            inputAudioContext = null;
            outputAudioContext = null;
            analyser = null;
            nextStartTime = 0;
            
            startBtn.disabled = false;
            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            
            userInput.placeholder = "Message...";
            imgTalking.classList.add('hidden-state');
            visualizerBars.forEach(bar => bar.style.height = '4px');
        }

        // イベントリスナー
        startBtn.addEventListener('click', () => { 
            if (!isSessionActive) startSession(); 
        });
        
        stopBtn.addEventListener('click', () => { 
            cleanupSession(); 
        });

        function handleTextSend() {
            const text = userInput.value.trim();
            if (!text) return;
            
            userInput.value = '';
            
            if (isHttpFallback || !isSessionActive) {
                if (!isSessionActive) startHttpSession();
                handleHttpSend(text);
            } else if (sessionPromise) {
                sessionPromise.then(session => {
                    if (session) session.sendRealtimeInput({ text: text });
                });
            }
        }

        sendBtn.addEventListener('click', handleTextSend);
        userInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') handleTextSend(); 
        });

    </script>
