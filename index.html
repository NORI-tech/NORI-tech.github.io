<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIトークルーム</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        fresh: {
                            bg: '#F4F7F9',
                            panel: '#FFFFFF',
                            mint: '#00BFA5',
                            accent: '#29B6F6'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            overscroll-behavior-y: none;
            background-color: #F0F4F8; 
            color: #334155;
        }

        /* アバターのコンテナ設定 */
        .avatar-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            background-color: #FFFFFF;
            border: 4px solid #E0F2FE;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes hover-float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .is-active .avatar-wrapper {
            animation: hover-float 4s ease-in-out infinite;
            border-color: #38BDF8;
            box-shadow: 0 15px 35px rgba(56, 189, 248, 0.25);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
            transition: opacity 0.1s ease;
        }

        .hidden-state {
            opacity: 0;
            pointer-events: none;
        }

        /* スクロールバー */
        #chat-log::-webkit-scrollbar { width: 6px; }
        #chat-log::-webkit-scrollbar-track { background: transparent; }
        #chat-log::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }

        /* メッセージ出現アニメーション */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .msg-bubble {
            animation: popIn 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* オーディオビジュアライザー */
        .visualizer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 24px;
        }
        .bar {
            width: 5px;
            background-color: #38BDF8;
            border-radius: 3px;
            height: 5px;
            transition: height 0.05s ease;
        }

        /* トースト通知 */
        @keyframes slideDown {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideDown 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* 白系のガラスモルフィズム */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 1);
        }
    </style>
    
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body class="h-screen h-[100dvh] flex flex-col overflow-hidden selection:bg-sky-200 selection:text-sky-900 antialiased font-sans bg-slate-50">

    <!-- 背景装飾 -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[-20%] left-[-10%] w-[50%] aspect-square rounded-full bg-sky-200/40 blur-[80px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] aspect-square rounded-full bg-teal-100/50 blur-[80px]"></div>
    </div>

    <!-- ヘッダー -->
    <header class="flex-none flex justify-between items-center px-5 py-3 glass-panel z-20 shadow-sm border-b border-sky-100 relative">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-sky-400 to-blue-500 flex items-center justify-center text-white shadow-md">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
            </div>
            <div>
                <h1 class="font-extrabold text-lg tracking-wide text-slate-800">AIトークルーム</h1>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="relative flex h-2 w-2">
                      <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-400 opacity-75 hidden"></span>
                      <span id="status-dot" class="relative inline-flex rounded-full h-2 w-2 bg-slate-400"></span>
                    </span>
                    <span id="mode-badge" class="text-[11px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">待機中</span>
                </div>
            </div>
        </div>
        <button id="open-settings-btn" class="p-2.5 rounded-full bg-slate-50 hover:bg-slate-100 text-slate-600 transition-all border border-slate-200 shadow-sm relative z-30 cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-none h-[45vh] md:h-[55vh] relative z-10 flex flex-col items-center justify-center p-4">
        <div id="avatar-container" class="w-full max-w-[40vh] md:max-w-[50vh] flex flex-col items-center justify-center gap-4">
            <div class="avatar-wrapper relative w-full">
                <img id="img-idle" src="https://placehold.co/800x800/E0F2FE/0284C7?text=Idle" alt="通常時" class="avatar-img" onerror="this.onerror=null; this.src='https://placehold.co/800x800/E0F2FE/0284C7?text=Idle';">
                <img id="img-talking" src="https://placehold.co/800x800/E0F2FE/0284C7?text=Talking" alt="会話時" class="avatar-img hidden-state" onerror="this.onerror=null; this.src='https://placehold.co/800x800/E0F2FE/0284C7?text=Talking';">
            </div>

            <!-- ステータス & ビジュアライザー -->
            <div class="glass-panel px-5 py-2 rounded-full flex items-center gap-4 shadow-sm border-sky-100">
                <span id="status-indicator" class="text-sm font-bold text-slate-500">準備OK！</span>
                <div class="visualizer-container" id="visualizer">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- チャットログ & 入力エリア -->
    <div class="flex-1 glass-panel flex flex-col overflow-hidden relative z-20 border-t border-white shadow-[0_-5px_20px_rgba(0,0,0,0.03)] rounded-t-3xl md:rounded-t-[2.5rem]">
        
        <!-- チャット履歴 -->
        <div id="chat-log" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 pb-36">
            <div id="welcome-msg" class="text-center text-slate-400 text-sm font-bold my-auto px-4 leading-relaxed bg-slate-50/50 p-4 rounded-2xl border border-slate-100 mx-auto max-w-sm">
                <p>下の「通話をスタート」ボタンを押してね。<br>マイクと文字、どちらでもお話しできるよ！</p>
            </div>
        </div>

        <!-- コントロールバー（z-40 を指定し最前面に） -->
        <div class="absolute bottom-0 left-0 w-full glass-panel p-3 pb-safe pt-3 px-4 shadow-[0_-10px_30px_rgba(0,0,0,0.08)] border-t border-sky-50 z-40">
            <div class="max-w-3xl mx-auto w-full flex flex-col gap-3">
                
                <!-- メイン通話ボタン -->
                <button id="start-btn" class="w-full bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 text-white font-bold h-12 rounded-xl shadow-md shadow-sky-200 transition-all active:scale-[0.98] text-[15px] tracking-wide flex items-center justify-center gap-2 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    通話をスタート
                </button>
                <button id="stop-btn" class="hidden w-full bg-rose-50 text-rose-500 border border-rose-200 hover:bg-rose-100 font-bold h-12 rounded-xl transition-all active:scale-[0.98] text-[15px] tracking-wide flex items-center justify-center gap-2 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                    通話をおわる
                </button>

                <!-- テキスト入力 -->
                <div class="flex gap-2 relative">
                    <input type="text" id="user-input" placeholder="メッセージを入力..." class="flex-grow bg-white border border-slate-200 rounded-xl px-4 h-11 focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100 text-slate-700 transition-all text-sm font-medium shadow-sm">
                    <button id="send-btn" class="bg-sky-500 hover:bg-sky-600 text-white font-bold w-11 h-11 rounded-xl shadow-sm transition-all active:scale-95 flex items-center justify-center shrink-0 cursor-pointer">
                        <svg class="w-5 h-5 translate-x-[-1px] translate-y-[1px]" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- トースト通知 (z-50) -->
    <div id="toast-container" class="fixed top-4 left-0 w-full flex justify-center z-50 pointer-events-none px-4 flex-col items-center gap-2"></div>

    <!-- 設定モーダル (z-50) -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 hidden overflow-y-auto">
        <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white border border-slate-100 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col">
                <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-sky-50/50">
                    <h2 class="text-lg font-extrabold text-slate-800 flex items-center gap-2">
                        <svg class="w-6 h-6 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                        いろいろな設定
                    </h2>
                    <button id="close-settings-btn" class="text-slate-400 hover:text-slate-700 p-1 rounded-full hover:bg-slate-100 transition bg-white shadow-sm border border-slate-100 cursor-pointer">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <div class="p-5 flex flex-col gap-6 overflow-y-auto max-h-[60vh] text-slate-700 bg-white">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Gemini APIキー (必須)</label>
                        <p class="text-[11px] text-sky-600 font-medium mb-2">※APIキーを入力しないとチャットを開始できません。</p>
                        <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-sky-400 focus:bg-white font-mono text-sm shadow-inner text-slate-700">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">AIの声（ボイス）</label>
                        <select id="voice-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-sky-400 focus:bg-white text-sm font-bold text-slate-700 appearance-none shadow-sm cursor-pointer">
                            <option value="Aoede">女性（おだやか） - Aoede</option>
                            <option value="Kore">女性（はきはき） - Kore</option>
                            <option value="Puck">男性（明るい） - Puck</option>
                            <option value="Zephyr">男性（さわやか） - Zephyr</option>
                            <option value="Fenrir">男性（クール） - Fenrir</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">AIの性格や役割（プロンプト）</label>
                        <textarea id="system-instruction-input" rows="4" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-sky-400 focus:bg-white text-sm text-slate-700 resize-none shadow-inner leading-relaxed" placeholder="プロンプトを入力..."></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">自分のアバター画像を使う</label>
                        <p class="text-[11px] text-slate-500 mb-3">※正方形がおすすめ。画像はブラウザに保存されるよ。</p>
                        <div class="flex flex-col gap-3">
                            <div class="flex items-center gap-3 bg-slate-50/50 p-3 rounded-xl border border-slate-100 shadow-sm">
                                <div class="w-12 h-12 rounded-xl bg-white border border-slate-200 overflow-hidden shrink-0 shadow-sm">
                                    <img id="preview-idle" src="https://placehold.co/400x400/E0F2FE/0284C7?text=Idle" class="w-full h-full object-cover">
                                </div>
                                <div class="flex-grow">
                                    <label class="text-xs font-bold text-slate-700 block mb-1">通常時（おくちをとじた画像）</label>
                                    <input type="file" id="upload-idle" accept="image/*" class="text-xs w-full file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-[11px] file:font-bold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 text-slate-500 cursor-pointer">
                                </div>
                            </div>
                            <div class="flex items-center gap-3 bg-slate-50/50 p-3 rounded-xl border border-slate-100 shadow-sm">
                                <div class="w-12 h-12 rounded-xl bg-white border border-slate-200 overflow-hidden shrink-0 shadow-sm">
                                    <img id="preview-talking" src="https://placehold.co/400x400/E0F2FE/0284C7?text=Talking" class="w-full h-full object-cover">
                                </div>
                                <div class="flex-grow">
                                    <label class="text-xs font-bold text-slate-700 block mb-1">会話時（おくちをあけた画像）</label>
                                    <input type="file" id="upload-talking" accept="image/*" class="text-xs w-full file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-[11px] file:font-bold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 text-slate-500 cursor-pointer">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="p-4 border-t border-slate-100 bg-slate-50">
                    <button id="save-settings-btn" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-sky-200 transition-all active:scale-[0.98] text-[15px] cursor-pointer">
                        保存してとじる
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script type="module">
        import { GoogleGenAI, Modality } from '@google/genai';

        // --- UI要素取得 ---
        const avatarContainer = document.getElementById('avatar-container');
        const imgIdle = document.getElementById('img-idle');
        const imgTalking = document.getElementById('img-talking');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatLog = document.getElementById('chat-log');
        const welcomeMsg = document.getElementById('welcome-msg');
        
        const statusIndicator = document.getElementById('status-indicator');
        const statusPing = document.getElementById('status-ping');
        const statusDot = document.getElementById('status-dot');
        const modeBadge = document.getElementById('mode-badge');
        const visualizerBars = document.querySelectorAll('.bar');

        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const apiKeyInput = document.getElementById('api-key-input');
        const voiceSelect = document.getElementById('voice-select');
        const systemInstructionInput = document.getElementById('system-instruction-input');
        const uploadIdle = document.getElementById('upload-idle');
        const uploadTalking = document.getElementById('upload-talking');
        const previewIdle = document.getElementById('preview-idle');
        const previewTalking = document.getElementById('preview-talking');

        // --- 状態変数 ---
        let ai = null;
        let sessionPromise = null;
        let isSessionActive = false;
        let isHttpFallback = false;

        let currentIdleBase64 = '';
        let currentTalkingBase64 = '';

        const DEFAULT_PROMPT = `あなたは中学生向けのフレンドリーなAIアシスタントです。
敬語はあまり使わず、親しみやすい言葉遣い（〜だよ、〜だね）で話しかけてください。
説明はわかりやすく、長すぎないように短くテンポよく返事をしてあげてください。
相手の話をよく聞いて、共感したり褒めたりすることを心がけてください。`;

        const savedSettings = JSON.parse(localStorage.getItem('cleanAvatarLiveSettings')) || {};
        
        let customApiKey = savedSettings.apiKey || '';
        let selectedVoice = savedSettings.voice || 'Aoede';
        let systemInstruction = savedSettings.systemInstruction || DEFAULT_PROMPT;
        currentIdleBase64 = savedSettings.idleImage || '';
        currentTalkingBase64 = savedSettings.talkingImage || '';

        apiKeyInput.value = customApiKey;
        voiceSelect.value = selectedVoice;
        systemInstructionInput.value = systemInstruction;

        if (currentIdleBase64) {
            imgIdle.src = currentIdleBase64;
            previewIdle.src = currentIdleBase64;
        }
        if (currentTalkingBase64) {
            imgTalking.src = currentTalkingBase64;
            previewTalking.src = currentTalkingBase64;
        }

        // オーディオ関連
        let inputAudioContext = null;
        let outputAudioContext = null;
        let analyser = null; 
        let mediaStream = null;
        let nextStartTime = 0;
        let isAnimating = false;
        let synthSpeakingInterval = null;
        const activeAudioSources = new Set();

        // --- トースト通知 ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const baseClass = "px-5 py-3 rounded-2xl shadow-xl text-sm toast-enter flex items-center gap-3 font-bold border pointer-events-auto bg-white";
            if (type === 'error') {
                toast.className = `${baseClass} text-rose-600 border-rose-200`;
                toast.innerHTML = `<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> <span>${message}</span>`;
            } else {
                toast.className = `${baseClass} text-sky-700 border-sky-100`;
                toast.innerHTML = `<svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg> <span>${message}</span>`;
            }
            
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideDown 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- 設定モーダル制御 ---
        openSettingsBtn.addEventListener('click', () => {
            if (isSessionActive) {
                showToast('通話中は設定をかえられないよ', 'error');
                return;
            }
            settingsModal.classList.remove('hidden');
        });
        const closeSettings = () => settingsModal.classList.add('hidden');
        closeSettingsBtn.addEventListener('click', closeSettings);
        
        function handleImageUpload(inputEl, previewEl, targetImgEl, stateKey) {
            inputEl.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const base64Str = evt.target.result;
                        previewEl.src = base64Str;
                        targetImgEl.src = base64Str;
                        if(stateKey === 'idle') currentIdleBase64 = base64Str;
                        if(stateKey === 'talking') currentTalkingBase64 = base64Str;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
        handleImageUpload(uploadIdle, previewIdle, imgIdle, 'idle');
        handleImageUpload(uploadTalking, previewTalking, imgTalking, 'talking');

        saveSettingsBtn.addEventListener('click', () => {
            customApiKey = apiKeyInput.value.trim();
            selectedVoice = voiceSelect.value;
            systemInstruction = systemInstructionInput.value.trim() || DEFAULT_PROMPT;

            const settingsToSave = {
                apiKey: customApiKey,
                voice: selectedVoice,
                systemInstruction: systemInstruction,
                idleImage: currentIdleBase64,
                talkingImage: currentTalkingBase64
            };
            
            try {
                localStorage.setItem('cleanAvatarLiveSettings', JSON.stringify(settingsToSave));
                showToast('設定をほぞんしたよ！');
                closeSettings();
            } catch (e) {
                console.error(e);
                showToast('保存容量を超えちゃった。画像のサイズを小さくしてみてね。', 'error');
            }
        });

        // --- Web Audio Worklet ---
        const workletCode = `
        class RecorderProcessor extends AudioWorkletProcessor {
            process(inputs) {
                const input = inputs[0];
                if (input && input.length > 0) {
                    this.port.postMessage(input[0]);
                }
                return true;
            }
        }
        registerProcessor('recorder-processor', RecorderProcessor);
        `;

        function createBlob(data) {
            const int16 = new Int16Array(data.length);
            for (let i = 0; i < data.length; i++) {
                int16[i] = data[i] * 32768; 
            }
            let binary = '';
            const bytes = new Uint8Array(int16.buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return {
                data: btoa(binary),
                mimeType: 'audio/pcm;rate=16000',
            };
        }

        async function decodeBase64ToAudioBuffer(base64Pcm, ctx, sampleRate = 24000) {
            const binary = atob(base64Pcm);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const dataInt16 = new Int16Array(bytes.buffer);
            const buffer = ctx.createBuffer(1, dataInt16.length, sampleRate);
            const channelData = buffer.getChannelData(0);
            for (let i = 0; i < dataInt16.length; i++) {
                channelData[i] = dataInt16[i] / 32768.0;
            }
            return buffer;
        }

        // --- リップシンク & ビジュアライザー ---
        function updateLipSync() {
            if (!analyser || !isSessionActive) {
                if (!synthSpeakingInterval) {
                    isAnimating = false;
                    imgIdle.classList.remove('hidden-state');
                    imgTalking.classList.add('hidden-state');
                    visualizerBars.forEach(bar => bar.style.height = '5px');
                }
                return;
            }
            isAnimating = true;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const averageVolume = sum / dataArray.length;

            if (averageVolume > 10) {
                imgIdle.classList.add('hidden-state');
                imgTalking.classList.remove('hidden-state');
            } else {
                imgIdle.classList.remove('hidden-state');
                imgTalking.classList.add('hidden-state');
            }

            visualizerBars.forEach((bar, index) => {
                const val = dataArray[index * 4] || 0;
                const height = Math.max(5, (val / 255) * 20);
                bar.style.height = `${height}px`;
            });

            requestAnimationFrame(updateLipSync);
        }

        function startSynthLipSync() {
            if (synthSpeakingInterval) clearInterval(synthSpeakingInterval);
            let state = false;
            synthSpeakingInterval = setInterval(() => {
                state = !state;
                if (state) {
                    imgIdle.classList.add('hidden-state');
                    imgTalking.classList.remove('hidden-state');
                } else {
                    imgIdle.classList.remove('hidden-state');
                    imgTalking.classList.add('hidden-state');
                }
                visualizerBars.forEach(bar => {
                    bar.style.height = `${Math.floor(Math.random() * 15) + 5}px`;
                });
            }, 100);
        }

        function stopSynthLipSync() {
            if (synthSpeakingInterval) {
                clearInterval(synthSpeakingInterval);
                synthSpeakingInterval = null;
            }
            imgIdle.classList.remove('hidden-state');
            imgTalking.classList.add('hidden-state');
            visualizerBars.forEach(bar => bar.style.height = '5px');
        }

        function updateStatus(message, state = 'info') {
            statusIndicator.textContent = message;
            
            if (state === 'error') {
                statusIndicator.className = 'text-sm font-bold text-rose-500';
                statusPing.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75';
                statusDot.className = 'relative inline-flex rounded-full h-2 w-2 bg-rose-500';
                statusPing.classList.remove('hidden');
            } else if (state === 'active') {
                statusIndicator.className = 'text-sm font-bold text-sky-500';
                statusPing.className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75';
                statusDot.className = 'relative inline-flex rounded-full h-2 w-2 bg-sky-500';
                statusPing.classList.remove('hidden');
            } else {
                statusIndicator.className = 'text-sm font-bold text-slate-500';
                statusDot.className = 'relative inline-flex rounded-full h-2 w-2 bg-slate-400';
                statusPing.classList.add('hidden');
            }
        }

        function addMessageToLog(sender, text) {
            if (welcomeMsg) welcomeMsg.style.display = 'none';

            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg-bubble', 'p-3.5', 'px-5', 'max-w-[85%]', 'text-[15px]', 'leading-relaxed', 'shadow-sm', 'font-medium');
            
            if (sender === 'user') {
                msgDiv.classList.add('bg-sky-500', 'text-white', 'rounded-2xl', 'rounded-br-sm');
                msgDiv.textContent = text;
            } else {
                msgDiv.classList.add('bg-white', 'text-slate-700', 'border', 'border-slate-100', 'rounded-2xl', 'rounded-tl-sm');
                msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            }
            
            msgWrapper.appendChild(msgDiv);
            chatLog.appendChild(msgWrapper);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        let currentInputText = '';
        let currentOutputText = '';

        // --- セッション開始 ---
        async function startSession() {
            try {
                // 【重要】APIキー未入力のチェック
                if (!customApiKey) {
                    showToast('右上の「設定」からGemini APIキーを入力してね！', 'error');
                    return;
                }

                updateStatus('準備しています...', 'info');
                startBtn.disabled = true;

                // 【重要】セキュアコンテキストチェック (HTTP環境でのマイクエラー防止)
                if (!window.isSecureContext && !isHttpFallback) {
                    console.warn("HTTP環境のため標準モードにフォールバックします");
                    switchToHttpMode("安全な通信環境(HTTPS)ではないため、文字と合成音声のモードで始めるね。");
                    return;
                }

                ai = new GoogleGenAI({ apiKey: customApiKey });

                if (isHttpFallback) {
                    startHttpSession();
                    return;
                }

                // マイク取得を安全に実行
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    mediaStream = await navigator.mediaDevices.getUserMedia({
                        audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true }
                    }).catch(e => {
                        console.warn("マイク取得エラー:", e);
                        return null; // 拒否やエラー時はnullで続行
                    });
                } else {
                    console.warn("マイクAPIが利用できません");
                }

                inputAudioContext = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
                outputAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                await inputAudioContext.resume();
                await outputAudioContext.resume();

                analyser = outputAudioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.connect(outputAudioContext.destination);

                const workletBlob = new Blob([workletCode], { type: "application/javascript" });
                await inputAudioContext.audioWorklet.addModule(URL.createObjectURL(workletBlob));
                
                updateStatus('AIとつないでいます...', 'info');

                const connectPromise = ai.live.connect({
                    model: 'gemini-2.0-flash-exp', 
                    callbacks: {
                        onopen: handleConnectionOpen,
                        onmessage: handleServerMessage,
                        onerror: (err) => { 
                            console.warn("Live API Error:", err); 
                            switchToHttpMode("通信エラーのため、標準モード（テキストと合成音声）に切り替えるね。");
                        },
                        onclose: () => { 
                            updateStatus('通話しゅうりょう', 'info'); 
                            cleanupSession(); 
                        }
                    },
                    config: {
                        responseModalities: [Modality.AUDIO],
                        speechConfig: {
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } }
                        },
                        inputAudioTranscription: {}, 
                        outputAudioTranscription: {},
                        systemInstruction: systemInstruction,
                    }
                });

                sessionPromise = connectPromise.catch((err) => {
                    console.warn("Live API Exception:", err);
                    switchToHttpMode("環境の制限のため、標準モードで始めるね。");
                    return null;
                });

                const session = await sessionPromise;
                if (!session) return; 

                isSessionActive = true;
                avatarContainer.classList.add('is-active');
                
            } catch (error) {
                console.warn("Setup Failed, switching to HTTP Fallback:", error);
                // エラー時もボタンのロックを確実に解除
                startBtn.disabled = false; 
                switchToHttpMode("通信がうまくいかなかったので、標準モードで始めるよ。");
            }
        }

        function switchToHttpMode(reasonMessage) {
            isHttpFallback = true;
            modeBadge.textContent = "標準モード";
            modeBadge.className = "text-[11px] font-bold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full";
            showToast(reasonMessage);
            cleanupSession();
            startHttpSession();
        }

        function startHttpSession() {
            isSessionActive = true;
            avatarContainer.classList.add('is-active');
            updateStatus('お話しできるよ！', 'active');
            
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            userInput.disabled = false;
            sendBtn.disabled = false;
            
            showToast('文字を入力するか、送信ボタンを押してね。');
        }

        function handleConnectionOpen() {
            modeBadge.textContent = "リアルタイム通信中";
            modeBadge.className = "text-[11px] font-bold text-sky-700 bg-sky-100 px-2 py-0.5 rounded-full";
            updateStatus('お話しできるよ！', 'active');
            
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            
            userInput.disabled = false;
            sendBtn.disabled = false;
            
            if (mediaStream && inputAudioContext) {
                const source = inputAudioContext.createMediaStreamSource(mediaStream);
                const recorder = new AudioWorkletNode(inputAudioContext, 'recorder-processor');

                recorder.port.onmessage = (event) => {
                    if (sessionPromise && isSessionActive) {
                        sessionPromise.then(session => {
                            if (session) session.sendRealtimeInput({ audio: createBlob(event.data) });
                        }).catch(() => {});
                    }
                };
                source.connect(recorder);
            }

            if (!isAnimating) updateLipSync();
        }

        async function handleServerMessage(message) {
            if (message.serverContent?.outputTranscription) {
                currentOutputText += message.serverContent.outputTranscription.text;
            } else if (message.serverContent?.inputTranscription) {
                currentInputText += message.serverContent.inputTranscription.text;
            }

            if (message.serverContent?.turnComplete) {
                const userTxt = currentInputText.trim();
                const aiTxt = currentOutputText.trim();
                if (userTxt) addMessageToLog('user', userTxt);
                if (aiTxt) addMessageToLog('ai', aiTxt);
                currentInputText = ''; 
                currentOutputText = '';
            }

            const audioB64 = message.serverContent?.modelTurn?.parts[0]?.inlineData?.data;
            if (audioB64 && outputAudioContext) {
                nextStartTime = Math.max(nextStartTime, outputAudioContext.currentTime);
                const audioBuffer = await decodeBase64ToAudioBuffer(audioB64, outputAudioContext, 24000);
                
                const source = outputAudioContext.createBufferSource();
                source.buffer = audioBuffer;
                
                source.connect(analyser); 
                source.addEventListener('ended', () => activeAudioSources.delete(source));
                
                source.start(nextStartTime);
                nextStartTime += audioBuffer.duration;
                activeAudioSources.add(source);
            }

            if (message.serverContent?.interrupted) {
                for (const src of activeAudioSources.values()) {
                    try { src.stop(); } catch(e){}
                }
                activeAudioSources.clear();
                nextStartTime = 0;
            }
        }

        // HTTPフォールバック時の送信処理
        async function handleHttpSend(text) {
            if (!customApiKey) {
                showToast('右上の「設定」からGemini APIキーを入力してね！', 'error');
                return;
            }

            addMessageToLog('user', text);
            updateStatus('かんがえ中...', 'active');
            
            try {
                if (!ai) ai = new GoogleGenAI({ apiKey: customApiKey });
                
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: text,
                    config: {
                        systemInstruction: systemInstruction
                    }
                });

                const replyText = response.text || "ごめんね、うまく通信できなかったみたい。";
                addMessageToLog('ai', replyText);
                updateStatus('お話しできるよ！', 'active');

                speakText(replyText);

            } catch (err) {
                console.error("HTTP GenAI Error:", err);
                showToast("エラーが起きちゃったみたい", "error");
                updateStatus('エラー', 'error');
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.05;
                utterance.pitch = 1.1;

                utterance.onstart = () => startSynthLipSync();
                utterance.onend = () => stopSynthLipSync();
                utterance.onerror = () => stopSynthLipSync();

                window.speechSynthesis.speak(utterance);
            }
        }

        function cleanupSession() {
            isSessionActive = false;
            avatarContainer.classList.remove('is-active');
            stopSynthLipSync();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            if (sessionPromise) {
                sessionPromise.then(session => {
                    if (session && typeof session.close === 'function') session.close();
                }).catch(() => {});
                sessionPromise = null;
            }
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            
            for (const src of activeAudioSources.values()) {
                try { src.stop(); } catch(e){}
            }
            activeAudioSources.clear();
            
            if (inputAudioContext) inputAudioContext.close().catch(() => {});
            if (outputAudioContext) outputAudioContext.close().catch(() => {});
            inputAudioContext = null;
            outputAudioContext = null;
            analyser = null;
            nextStartTime = 0;
            
            startBtn.disabled = false;
            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            
            userInput.placeholder = "メッセージを入力...";
            imgIdle.classList.remove('hidden-state');
            imgTalking.classList.add('hidden-state');
            visualizerBars.forEach(bar => bar.style.height = '5px');
            
            updateStatus('待機中', 'info');
            if(!isHttpFallback) {
                modeBadge.textContent = "待機中";
                modeBadge.className = "text-[11px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full";
            }
        }

        // --- イベントリスナー ---
        startBtn.addEventListener('click', () => { 
            if (!isSessionActive) startSession(); 
        });
        
        stopBtn.addEventListener('click', () => { 
            cleanupSession(); 
        });

        function handleTextSend() {
            const text = userInput.value.trim();
            if (!text) return;
            
            userInput.value = '';
            
            if (isHttpFallback || !isSessionActive) {
                if (!isSessionActive) startHttpSession();
                handleHttpSend(text);
            } else if (sessionPromise) {
                sessionPromise.then(session => {
                    if (session) session.sendRealtimeInput({ text: text });
                });
            }
        }

        sendBtn.addEventListener('click', handleTextSend);
        userInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') handleTextSend(); 
        });

    </script>
</body>
