<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIお姉さんとおしゃべり</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 子ども向けに柔らかい丸ゴシックフォントを導入 -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            overscroll-behavior-y: none; /* スワイプ時のバウンス防止 */
        }

        /* アバターのコンテナ設定 */
        .avatar-wrapper {
            position: relative;
            width: 100%;
            max-width: 100%; /* 固定幅の制限を解除 */
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(125, 211, 252, 0.5);
            background-color: #f0f9ff;
            border: 6px solid #bae6fd;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* ふわふわ浮遊アニメーション */
        @keyframes hover-float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .is-active .avatar-wrapper {
            animation: hover-float 4s ease-in-out infinite;
            border-color: #38bdf8;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
        }

        /* アバター画像 */
        .avatar-img {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
            transition: opacity 0.15s ease;
        }

        .hidden-state {
            opacity: 0;
            pointer-events: none;
        }

        /* スクロールバーのデザイン */
        #chat-log::-webkit-scrollbar {
            width: 6px;
        }
        #chat-log::-webkit-scrollbar-track {
            background: transparent;
        }
        #chat-log::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* メッセージ出現アニメーション */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .msg-bubble {
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* オーディオビジュアライザー */
        .visualizer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 24px;
        }
        .bar {
            width: 6px;
            background-color: #38bdf8;
            border-radius: 9999px;
            height: 6px;
            transition: height 0.05s ease;
        }

        /* トースト通知のアニメーション */
        @keyframes slideDown {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideDown 0.3s ease-out forwards;
        }
    </style>
    
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
</head>
<body class="bg-sky-50 text-slate-700 h-screen h-[100dvh] flex flex-col overflow-hidden selection:bg-sky-200">

    <!-- ヘッダー -->
    <header class="flex-none flex justify-between items-center px-5 py-3 bg-white/80 backdrop-blur-md shadow-sm z-20 rounded-b-3xl">
        <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 bg-sky-400 rounded-full flex items-center justify-center text-white shadow-inner">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
            </div>
            <div>
                <h1 class="font-bold text-lg text-sky-800 tracking-wide leading-tight">AIお姉さん</h1>
                <span id="mode-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-100 text-sky-600">通常モード</span>
            </div>
        </div>
        <button id="open-settings-btn" class="p-2 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition active:scale-95">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </header>

  <!-- メインコンテンツ -->
    <main class="flex-none h-[45vh] md:h-[55vh] lg:h-[60vh] relative flex flex-col items-center justify-center p-2 md:p-4">
        <!-- アバターが限界まで大きくなるよう、高さを基準(vh)にした可変幅に変更 -->
        <div id="avatar-container" class="h-full w-full max-w-[40vh] md:max-w-[50vh] lg:max-w-[55vh] flex flex-col items-center justify-center gap-3 md:gap-4 mt-2">
            <div class="avatar-wrapper relative flex-shrink-0 w-full">
                <img id="img-idle" src="idle.jpg" alt="待機中" class="avatar-img" onerror="this.onerror=null; this.src='https://placehold.co/800x800/bae6fd/0284c7?text=Idle';">
                <img id="img-talking" src="talking.jpg" alt="お話し中" class="avatar-img hidden-state" onerror="this.onerror=null; this.src='https://placehold.co/800x800/bae6fd/0284c7?text=Talking';">
            </div>

            <!-- ステータスとビジュアライザー -->
            <div class="bg-white/80 backdrop-blur-sm px-4 py-1.5 rounded-2xl shadow-sm flex items-center gap-3 border border-sky-100 flex-shrink-0">
                <span id="status-indicator" class="text-sm font-bold text-slate-500">お話しできるよ！</span>
                <div class="visualizer-container" id="visualizer">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    <div class="bar"></div><div class="bar"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- チャットログと入力エリア (下半分) -->
    <div class="flex-1 bg-white rounded-t-[2.5rem] shadow-[0_-10px_20px_rgba(0,0,0,0.03)] flex flex-col overflow-hidden relative z-10 border-t border-sky-100">
        
        <!-- チャット履歴 -->
        <div id="chat-log" class="flex-1 overflow-y-auto p-4 md:p-5 flex flex-col gap-3 pb-28">
            <div class="text-center text-sky-400/80 text-sm font-bold my-auto px-4 leading-relaxed">
                <p id="welcome-msg">下の「お話しスタート！」ボタンをおしてね。<br>マイクや文字でお話しできるよ！</p>
            </div>
        </div>

        <!-- コントロールバー（入力欄とマイクボタン） -->
        <div class="absolute bottom-0 left-0 w-full bg-white border-t border-sky-50 p-3 pb-safe pt-2 px-4 shadow-[0_-5px_15px_rgba(0,0,0,0.02)]">
            <div class="max-w-3xl mx-auto w-full flex flex-col gap-2.5">
                
                <!-- メインの通話ボタン -->
                <button id="start-btn" class="w-full bg-gradient-to-r from-sky-400 to-blue-400 hover:from-sky-500 hover:to-blue-500 text-white font-bold h-12 py-2.5 rounded-2xl shadow-[0_4px_15px_rgba(56,189,248,0.4)] transform transition active:scale-95 text-base flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    お話しスタート！
                </button>
                <button id="stop-btn" class="hidden w-full bg-rose-100 text-rose-600 hover:bg-rose-200 font-bold h-12 py-2.5 rounded-2xl shadow-sm transform transition active:scale-95 text-base flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                    お話しをおわる
                </button>

                <!-- テキスト入力 -->
                <div class="flex gap-2 relative">
                    <input type="text" id="user-input" placeholder="メッセージを入力してね" class="flex-grow bg-slate-50 border-2 border-slate-100 rounded-xl px-4 h-11 focus:outline-none focus:border-sky-300 focus:bg-white text-slate-700 transition font-bold text-sm">
                    <button id="send-btn" class="bg-sky-400 hover:bg-sky-500 text-white font-bold w-11 h-11 rounded-xl shadow-sm transform transition active:scale-95 flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 translate-x-[-1px] translate-y-[1px]" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- トースト通知コンテナ -->
    <div id="toast-container" class="fixed top-4 left-0 w-full flex justify-center z-50 pointer-events-none px-4"></div>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden overflow-y-auto">
        <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col">
                <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-sky-50/50">
                    <h2 class="text-xl font-bold text-sky-800 flex items-center gap-2">
                        <svg class="w-6 h-6 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                        せってい
                    </h2>
                    <button id="close-settings-btn" class="text-slate-400 hover:text-slate-600 p-1 rounded-full hover:bg-slate-100 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <div class="p-5 flex flex-col gap-5 overflow-y-auto max-h-[60vh]">
                    <!-- APIキー設定 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Gemini APIキー</label>
                        <p class="text-xs text-sky-600 font-bold mb-2">※未入力の場合は標準環境キーを使用します</p>
                        <input type="password" id="api-key-input" placeholder="AIzaSy..." class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-sky-400 font-mono text-sm">
                    </div>

                    <!-- ボイス設定 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">AIのボイス (声)</label>
                        <select id="voice-select" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-sky-400 font-bold text-slate-700 appearance-none">
                            <option value="Aoede">お姉さん (Aoede - 優しい)</option>
                            <option value="Kore">お姉さん2 (Kore - しっかり)</option>
                            <option value="Puck">お兄さん (Puck - 元気)</option>
                            <option value="Zephyr">お兄さん2 (Zephyr - 明るい)</option>
                        </select>
                    </div>

                    <!-- AIのプロンプト/Gem設定 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">AIの性格・役割 (Gemの指示文)</label>
                        <p class="text-xs text-slate-500 mb-2">Geminiで使っているGemのプロンプトをここに貼り付けると、同じGemとしてお話しできます。</p>
                        <textarea id="system-instruction-input" rows="4" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:border-sky-400 text-xs font-bold text-slate-700 resize-none" placeholder="例：あなたは英会話の先生です。優しく英語で話しかけてください。"></textarea>
                    </div>

                    <!-- カスタムアバター設定 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">オリジナルのアバター画像</label>
                        <p class="text-xs text-slate-500 mb-3">すきな画像にかえられるよ。（正方形がおすすめ）</p>
                        
                        <div class="flex flex-col gap-3">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden shrink-0">
                                    <img id="preview-idle" src="https://placehold.co/400x400/bae6fd/0284c7?text=Idle" class="w-full h-full object-cover">
                                </div>
                                <div class="flex-grow">
                                    <label class="text-xs font-bold text-slate-600 block mb-1">おくちをとじた画像</label>
                                    <input type="file" id="upload-idle" accept="image/*" class="text-xs w-full file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                                </div>
                            </div>

                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden shrink-0">
                                    <img id="preview-talking" src="https://placehold.co/400x400/bae6fd/0284c7?text=Talking" class="w-full h-full object-cover">
                                </div>
                                <div class="flex-grow">
                                    <label class="text-xs font-bold text-slate-600 block mb-1">おくちをあけた画像</label>
                                    <input type="file" id="upload-talking" accept="image/*" class="text-xs w-full file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="p-4 border-t border-slate-100 bg-slate-50">
                    <button id="save-settings-btn" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-4 rounded-xl shadow-sm transform transition active:scale-95">
                        保存してとじる
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script type="module">
        import { GoogleGenAI, Modality } from '@google/genai';

        // --- UI要素の取得 ---
        const avatarContainer = document.getElementById('avatar-container');
        const imgIdle = document.getElementById('img-idle');
        const imgTalking = document.getElementById('img-talking');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatLog = document.getElementById('chat-log');
        const statusIndicator = document.getElementById('status-indicator');
        const visualizerBars = document.querySelectorAll('.bar');
        const modeBadge = document.getElementById('mode-badge');

        // 設定用要素
        const settingsModal = document.getElementById('settings-modal');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const apiKeyInput = document.getElementById('api-key-input');
        const voiceSelect = document.getElementById('voice-select');
        const systemInstructionInput = document.getElementById('system-instruction-input');
        const uploadIdle = document.getElementById('upload-idle');
        const uploadTalking = document.getElementById('upload-talking');
        const previewIdle = document.getElementById('preview-idle');
        const previewTalking = document.getElementById('preview-talking');

        // --- 状態変数 ---
        let ai = null;
        let sessionPromise = null;
        let isSessionActive = false;
        let isHttpFallback = false;

        // --- localStorage から設定を読み込む ---
        const savedSettings = JSON.parse(localStorage.getItem('geminiAvatarChatSettings')) || {};
        
        // 読み込んだ設定を初期値として適用（なければデフォルト値）
        let selectedVoice = savedSettings.voice || 'Aoede';
        let customApiKey = savedSettings.apiKey || '';
        let systemInstruction = savedSettings.systemInstruction || `あなたは小学校中〜高学年や中学生に寄り添う、優しくて親しみやすいAIアシスタントです。
お姉さんのような温かい口調で、短くリズミカルに、簡単な言葉を使って会話してください。
相手を否定せず、まずは共感して褒めることを心がけてください。`;

        // 初期値を設定モーダルの各欄にセット
        apiKeyInput.value = customApiKey;
        voiceSelect.value = selectedVoice;
        systemInstructionInput.value = systemInstruction;

        // オーディオ関連
        let inputAudioContext = null;
        let outputAudioContext = null;
        let analyser = null; 
        let mediaStream = null;
        let nextStartTime = 0;
        let isAnimating = false;
        let synthSpeakingInterval = null;
        const activeAudioSources = new Set();

        // ターゲット層に向けたAIのペルソナ設定
        const SYSTEM_INSTRUCTION = `
            あなたは小学校中〜高学年の子どもたちに寄り添う、優しくて親しみやすい女性のAIアシスタントです。
            お姉さんのような温かい口調で、短くリズミカルに、簡単な言葉を使って会話してください。
            子どもを否定せず、まずは共感して褒めることを心がけてください。
            漢字は使いすぎず、難しい言葉は避けてください。
        `;

        // トースト通知機能
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'error' ? 'bg-rose-500' : 'bg-slate-800';
            toast.className = `${bgColor} text-white px-5 py-2.5 rounded-full shadow-xl font-bold text-xs sm:text-sm toast-enter flex items-center gap-2 pointer-events-auto mt-2`;
            
            const icon = type === 'error' 
                ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                : `<svg class="w-4 h-4 text-sky-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideDown 0.3s ease-in reverse forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // 制御モーダルイベント
        openSettingsBtn.addEventListener('click', () => {
            if (isSessionActive) {
                showToast('お話し中は設定をかえられないよ', 'error');
                return;
            }
            settingsModal.classList.remove('hidden');
        });

        const closeSettings = () => settingsModal.classList.add('hidden');
        closeSettingsBtn.addEventListener('click', closeSettings);
        
        // 画像アップロード処理
        function handleImageUpload(inputEl, previewEl, targetImgEl) {
            inputEl.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    previewEl.src = url;
                    targetImgEl.src = url;
                }
            });
        }
        handleImageUpload(uploadIdle, previewIdle, imgIdle);
        handleImageUpload(uploadTalking, previewTalking, imgTalking);

        // 設定の保存 (localStorageへの保存を追加)
        saveSettingsBtn.addEventListener('click', () => {
            customApiKey = apiKeyInput.value.trim();
            selectedVoice = voiceSelect.value;
            if (systemInstructionInput.value.trim()) {
                systemInstruction = systemInstructionInput.value.trim();
            }

            // localStorage に設定を保存
            const settingsToSave = {
                apiKey: customApiKey,
                voice: selectedVoice,
                systemInstruction: systemInstruction
            };
            localStorage.setItem('geminiAvatarChatSettings', JSON.stringify(settingsToSave));

            showToast('設定をほぞんしたよ！');
            closeSettings();
        });

        // Web Audio Worklet
        const workletCode = `
        class RecorderProcessor extends AudioWorkletProcessor {
            process(inputs) {
                const input = inputs[0];
                if (input && input.length > 0) {
                    this.port.postMessage(input[0]);
                }
                return true;
            }
        }
        registerProcessor('recorder-processor', RecorderProcessor);
        `;

        function createBlob(data) {
            const int16 = new Int16Array(data.length);
            for (let i = 0; i < data.length; i++) {
                int16[i] = data[i] * 32768; 
            }
            let binary = '';
            const bytes = new Uint8Array(int16.buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return {
                data: btoa(binary),
                mimeType: 'audio/pcm;rate=16000',
            };
        }

        async function decodeBase64ToAudioBuffer(base64Pcm, ctx, sampleRate = 24000) {
            const binary = atob(base64Pcm);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const dataInt16 = new Int16Array(bytes.buffer);
            const buffer = ctx.createBuffer(1, dataInt16.length, sampleRate);
            const channelData = buffer.getChannelData(0);
            for (let i = 0; i < dataInt16.length; i++) {
                channelData[i] = dataInt16[i] / 32768.0;
            }
            return buffer;
        }

        // リップシンク & ビジュアライザー
        function updateLipSync() {
            if (!analyser || !isSessionActive) {
                if (!synthSpeakingInterval) {
                    isAnimating = false;
                    imgIdle.classList.remove('hidden-state');
                    imgTalking.classList.add('hidden-state');
                    visualizerBars.forEach(bar => bar.style.height = '6px');
                }
                return;
            }
            isAnimating = true;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            const averageVolume = sum / dataArray.length;

            if (averageVolume > 12) {
                imgIdle.classList.add('hidden-state');
                imgTalking.classList.remove('hidden-state');
            } else {
                imgIdle.classList.remove('hidden-state');
                imgTalking.classList.add('hidden-state');
            }

            visualizerBars.forEach((bar, index) => {
                const val = dataArray[index * 4] || 0;
                const height = Math.max(6, (val / 255) * 22);
                bar.style.height = `${height}px`;
            });

            requestAnimationFrame(updateLipSync);
        }

        // Web Speech API（TTS）用 口パクシミュレーター
        function startSynthLipSync() {
            if (synthSpeakingInterval) clearInterval(synthSpeakingInterval);
            let state = false;
            synthSpeakingInterval = setInterval(() => {
                state = !state;
                if (state) {
                    imgIdle.classList.add('hidden-state');
                    imgTalking.classList.remove('hidden-state');
                } else {
                    imgIdle.classList.remove('hidden-state');
                    imgTalking.classList.add('hidden-state');
                }
                visualizerBars.forEach(bar => {
                    bar.style.height = `${Math.floor(Math.random() * 16) + 6}px`;
                });
            }, 120);
        }

        function stopSynthLipSync() {
            if (synthSpeakingInterval) {
                clearInterval(synthSpeakingInterval);
                synthSpeakingInterval = null;
            }
            imgIdle.classList.remove('hidden-state');
            imgTalking.classList.add('hidden-state');
            visualizerBars.forEach(bar => bar.style.height = '6px');
        }

        function updateStatus(message, state = 'info') {
            statusIndicator.textContent = message;
            if (state === 'error') {
                statusIndicator.className = 'text-sm font-bold text-rose-500';
            } else if (state === 'active') {
                statusIndicator.className = 'text-sm font-bold text-sky-500 animate-pulse';
            } else {
                statusIndicator.className = 'text-sm font-bold text-slate-500';
            }
        }

        function addMessageToLog(sender, text) {
            const placeholder = chatLog.querySelector('.text-center');
            if (placeholder) placeholder.style.display = 'none';

            const msgWrapper = document.createElement('div');
            msgWrapper.className = `flex w-full ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('msg-bubble', 'p-3.5', 'px-4', 'max-w-[85%]', 'text-[15px]', 'leading-relaxed', 'shadow-sm');
            
            if (sender === 'user') {
                msgDiv.classList.add('bg-sky-400', 'text-white', 'rounded-2xl', 'rounded-br-sm');
                msgDiv.textContent = text;
            } else {
                msgDiv.classList.add('bg-slate-50', 'text-slate-700', 'border', 'border-slate-200', 'rounded-2xl', 'rounded-tl-sm');
                msgDiv.textContent = text;
            }
            
            msgWrapper.appendChild(msgDiv);
            chatLog.appendChild(msgWrapper);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        let currentInputText = '';
        let currentOutputText = '';

        async function startSession() {
            try {
                updateStatus('じゅんびちゅう...', 'info');
                startBtn.disabled = true;

                // API Keyの設定
                ai = new GoogleGenAI({ apiKey: customApiKey });

                // HTTPフォールバック（標準インタラクティブモード）
                if (isHttpFallback) {
                    startHttpSession();
                    return;
                }

                // WebSocket (Live API) 接続の試行
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true }
                }).catch(() => null);

                inputAudioContext = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
                outputAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                await inputAudioContext.resume();
                await outputAudioContext.resume();

                analyser = outputAudioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.connect(outputAudioContext.destination);

                const workletBlob = new Blob([workletCode], { type: "application/javascript" });
                await inputAudioContext.audioWorklet.addModule(URL.createObjectURL(workletBlob));
                
                updateStatus('AIとつないでいるよ...', 'info');

                // UNHANDLEDREJECTION を防止するために try/catch & catch ハンドラを接続
                const connectPromise = ai.live.connect({
                    model: 'gemini-3.1-flash-live-preview',
                    callbacks: {
                        onopen: handleConnectionOpen,
                        onmessage: handleServerMessage,
                        onerror: (err) => { 
                            console.warn("Live API Error:", err); 
                            switchToHttpMode("WebSocket通信が制限されている環境のため、標準モードに切り替えました！");
                        },
                        onclose: () => { 
                            updateStatus('おはなし終了', 'info'); 
                            cleanupSession(); 
                        }
                    },
                    config: {
                        responseModalities: [Modality.AUDIO],
                        speechConfig: {
                            voiceConfig: { prebuiltVoiceConfig: { voiceName: selectedVoice } }
                        },
                        inputAudioTranscription: {}, 
                        outputAudioTranscription: {},
                        systemInstruction: systemInstruction,
                    }
                });

                sessionPromise = connectPromise.catch((err) => {
                    console.warn("WebSocket Security / Network Exception:", err);
                    switchToHttpMode("キャンバス表示（制限環境）のため標準テキスト・音声モードで開始します");
                    return null;
                });

                const session = await sessionPromise;
                if (!session) return; // エラー時はHTTPモードへ移行

                isSessionActive = true;
                avatarContainer.classList.add('is-active');
                
            } catch (error) {
                console.warn("Live API Failed, switching to HTTP Fallback:", error);
                switchToHttpMode("標準モードでお話しを開始するよ！");
            }
        }

        function switchToHttpMode(reasonMessage) {
            isHttpFallback = true;
            modeBadge.textContent = "標準モード (HTTP)";
            modeBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700";
            showToast(reasonMessage);
            cleanupSession();
            startHttpSession();
        }

        function startHttpSession() {
            isSessionActive = true;
            avatarContainer.classList.add('is-active');
            updateStatus('お話しできるよ！', 'active');
            
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            userInput.disabled = false;
            sendBtn.disabled = false;
            
            showToast('メッセージを入力するか送信ボタンを押してお話ししてね！');
        }

        function handleConnectionOpen() {
            modeBadge.textContent = "リアルタイム(WS)";
            modeBadge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700";
            updateStatus('お話しできるよ！', 'active');
            
            startBtn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            
            userInput.disabled = false;
            sendBtn.disabled = false;
            
            if (mediaStream && inputAudioContext) {
                const source = inputAudioContext.createMediaStreamSource(mediaStream);
                const recorder = new AudioWorkletNode(inputAudioContext, 'recorder-processor');

                recorder.port.onmessage = (event) => {
                    if (sessionPromise && isSessionActive) {
                        sessionPromise.then(session => {
                            if (session) session.sendRealtimeInput({ audio: createBlob(event.data) });
                        }).catch(() => {});
                    }
                };
                source.connect(recorder);
            }

            if (!isAnimating) updateLipSync();
        }

        async function handleServerMessage(message) {
            if (message.serverContent?.outputTranscription) {
                currentOutputText += message.serverContent.outputTranscription.text;
            } else if (message.serverContent?.inputTranscription) {
                currentInputText += message.serverContent.inputTranscription.text;
            }

            if (message.serverContent?.turnComplete) {
                const userTxt = currentInputText.trim();
                const aiTxt = currentOutputText.trim();
                if (userTxt) addMessageToLog('user', userTxt);
                if (aiTxt) addMessageToLog('ai', aiTxt);
                currentInputText = ''; 
                currentOutputText = '';
            }

            const audioB64 = message.serverContent?.modelTurn?.parts[0]?.inlineData?.data;
            if (audioB64 && outputAudioContext) {
                nextStartTime = Math.max(nextStartTime, outputAudioContext.currentTime);
                const audioBuffer = await decodeBase64ToAudioBuffer(audioB64, outputAudioContext, 24000);
                
                const source = outputAudioContext.createBufferSource();
                source.buffer = audioBuffer;
                
                source.connect(analyser); 
                source.addEventListener('ended', () => activeAudioSources.delete(source));
                
                source.start(nextStartTime);
                nextStartTime += audioBuffer.duration;
                activeAudioSources.add(source);
            }

            if (message.serverContent?.interrupted) {
                for (const src of activeAudioSources.values()) {
                    try { src.stop(); } catch(e){}
                }
                activeAudioSources.clear();
                nextStartTime = 0;
            }
        }

        async function handleHttpSend(text) {
            addMessageToLog('user', text);
            updateStatus('かんがえているよ...', 'active');
            
            try {
                if (!ai) ai = new GoogleGenAI({ apiKey: customApiKey });
                
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: text,
                    config: {
                        systemInstruction: systemInstruction
                    }
                });

                const replyText = response.text || "ごめんなさい、うまくききとれなかったよ。";
                addMessageToLog('ai', replyText);
                updateStatus('お話しできるよ！', 'active');

                // 音声読み上げ（TTS） & リップシンク
                speakText(replyText);

            } catch (err) {
                console.error("HTTP GenAI Error:", err);
                showToast("エラーが発生しました", "error");
                updateStatus('エラー', 'error');
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.0;
                utterance.pitch = 1.2;

                utterance.onstart = () => startSynthLipSync();
                utterance.onend = () => stopSynthLipSync();
                utterance.onerror = () => stopSynthLipSync();

                window.speechSynthesis.speak(utterance);
            }
        }

        function cleanupSession() {
            isSessionActive = false;
            avatarContainer.classList.remove('is-active');
            stopSynthLipSync();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            if (sessionPromise) {
                sessionPromise.then(session => {
                    if (session && typeof session.close === 'function') session.close();
                }).catch(() => {});
                sessionPromise = null;
            }
            
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            
            for (const src of activeAudioSources.values()) {
                try { src.stop(); } catch(e){}
            }
            activeAudioSources.clear();
            
            if (inputAudioContext) inputAudioContext.close().catch(() => {});
            if (outputAudioContext) outputAudioContext.close().catch(() => {});
            inputAudioContext = null;
            outputAudioContext = null;
            analyser = null;
            nextStartTime = 0;
            
            startBtn.disabled = false;
            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            
            userInput.placeholder = "メッセージを入力してね";
            imgIdle.classList.remove('hidden-state');
            imgTalking.classList.add('hidden-state');
            visualizerBars.forEach(bar => bar.style.height = '6px');
        }

        // イベントリスナー
        startBtn.addEventListener('click', () => { 
            if (!isSessionActive) startSession(); 
        });
        
        stopBtn.addEventListener('click', () => { 
            cleanupSession(); 
        });

        function handleTextSend() {
            const text = userInput.value.trim();
            if (!text) return;
            
            userInput.value = '';
            
            if (isHttpFallback || !isSessionActive) {
                if (!isSessionActive) startHttpSession();
                handleHttpSend(text);
            } else if (sessionPromise) {
                sessionPromise.then(session => {
                    if (session) session.sendRealtimeInput({ text: text });
                });
            }
        }

        sendBtn.addEventListener('click', handleTextSend);
        userInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') handleTextSend(); 
        });

        apiKeyInput.value = customApiKey;

    </script>
